name: Build LineageOS Apps

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: 'android_packages_apps_Aperture'
            name: 'Aperture'
          - repo: 'android_packages_apps_Recorder'
            name: 'Recorder'
          - repo: 'android_packages_apps_Twelve'
            name: 'Twelve'
          - repo: 'android_packages_apps_DeskClock'
            name: 'DeskClock'
          - repo: 'android_packages_apps_Glimpse'
            name: 'Glimpse'

    steps:
    - name: Checkout ${{ matrix.name }} (default branch)
      uses: actions/checkout@v4
      with:
        repository: LineageOS/${{ matrix.repo }}
        fetch-depth: 1

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.build.abi=arm64-v8a \
          -x lint

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-aarch64-latest
        path: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        retention-days: 7
