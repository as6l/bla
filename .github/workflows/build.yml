name: Build LineageOS Apps

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: 'android_packages_apps_Aperture'
            name: 'Aperture'
          - repo: 'android_packages_apps_Recorder'
            name: 'Recorder'
          - repo: 'android_packages_apps_Twelve'
            name: 'Twelve'
          - repo: 'android_packages_apps_DeskClock'
            name: 'DeskClock'
          - repo: 'android_packages_apps_Glimpse'
            name: 'Glimpse'

    steps:
    - name: Checkout ${{ matrix.name }}
      uses: actions/checkout@v5
      with:
        repository: LineageOS/${{ matrix.repo }}
        fetch-depth: 1

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.build.abi=arm64-v8a \
          -x lint

    - name: Collect APKs into one directory
      run: |
        mkdir -p collected-apks
        find . -name "*.apk" -type f | while read apk; do
          cp "$apk" "collected-apks/${{ matrix.name }}-$(basename "$apk")"
        done
        echo "=== Collected APKs ==="
        ls -la collected-apks/

    - name: Upload ${{ matrix.name }} APK
      uses: actions/upload-artifact@v6
      with:
        name: apk-${{ matrix.name }}
        path: collected-apks/
        if-no-files-found: warn
        retention-days: 7

  package:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Download all APK artifacts
      uses: actions/download-artifact@v6
      with:
        path: apks
        pattern: apk-*
        merge-multiple: true
      continue-on-error: true

    - name: Ensure apks directory exists
      run: |
        if [ ! -d apks ]; then
          echo "No artifacts were downloaded. Creating empty apks directory."
          mkdir -p apks
        fi
        echo "=== Downloaded APKs ==="
        find apks -type f -name "*.apk" -print || echo "No APK files found."

    - name: Create unified zip
      run: |
        cd apks
        if [ -z "$(find . -name '*.apk' -type f)" ]; then
          echo "No APK files to package. Skipping zip creation."
          exit 0
        fi
        zip -r ../lineage-apps-aarch64-latest.zip .
        echo "=== Zip contents ==="
        unzip -l ../lineage-apps-aarch64-latest.zip

    - name: Upload unified zip
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: lineage-apps-aarch64-latest-zip
        path: lineage-apps-aarch64-latest.zip
        if-no-files-found: warn
        retention-days: 7
