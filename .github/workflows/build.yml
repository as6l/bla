name: Build LineageOS Apps

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: 'android_packages_apps_Aperture'
            name: 'Aperture'
          - repo: 'android_packages_apps_Recorder'
            name: 'Recorder'
          - repo: 'android_packages_apps_Twelve'
            name: 'Twelve'
          - repo: 'android_packages_apps_DeskClock'
            name: 'DeskClock'
          - repo: 'android_packages_apps_Glimpse'
            name: 'Glimpse'

    steps:
    - name: Checkout ${{ matrix.name }}
      uses: actions/checkout@v5
      with:
        repository: LineageOS/${{ matrix.repo }}
        fetch-depth: 1

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.build.abi=arm64-v8a \
          -x lint

    - name: Upload ${{ matrix.name }} APK
      uses: actions/upload-artifact@v6
      with:
        name: apk-${{ matrix.name }}
        path: '**/build/outputs/apk/**/*.apk'
        if-no-files-found: warn
        retention-days: 7

  package:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Download all APK artifacts
      uses: actions/download-artifact@v6
      with:
        path: apks
        pattern: apk-*
        merge-multiple: true

    - name: Create unified zip
      run: |
        cd apks
        zip -r ../lineage-apps-aarch64-latest.zip .

    - name: Upload unified zip
      uses: actions/upload-artifact@v6
      with:
        name: lineage-apps-aarch64-latest-zip
        path: lineage-apps-aarch64-latest.zip
        retention-days: 7
